version: '2.3'
services:
  stamus_networks-alerts-mock:
    image: docker.elastic.co/observability/stream:v0.22.0
    hostname: stamus_networks-alerts-mock
    ports:
      - 8090
    volumes:
      - ./files:/files:ro
    environment:
      PORT: '8090'
    command:
      - http-server
      - --addr=:8090
      - --config=/files/config-alerts.yml
  stamus_networks-anomaly-mock:
    image: docker.elastic.co/observability/stream:v0.22.0
    hostname: stamus_networks-anomaly-mock
    ports:
      - 8090
    volumes:
      - ./files:/files:ro
    environment:
      PORT: '8090'
    command:
      - http-server
      - --addr=:8090
      - --config=/files/config-anomaly.yml
  stamus_networks-smb_insights-mock:
    image: docker.elastic.co/observability/stream:v0.22.0
    hostname: stamus_networks-smb_insights-mock
    ports:
      - 8090
    volumes:
      - ./files:/files:ro
    environment:
      PORT: '8090'
    command:
      - http-server
      - --addr=:8090
      - --config=/files/config-smb_insights.yml
