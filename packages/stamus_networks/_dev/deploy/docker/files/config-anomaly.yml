  # --- event_type:anomaly, page 2 (round 1 only; never requested again in round 2+) ---
  - path: /rest/rules/es/events_tail/
    methods: ['GET']
    query_params:
      qfilter: 'event_type:anomaly'
      page_number: '2'
      page_size: '2'
      from_date: "{fd:.*}"
      to_date: "{td:.*}"
    request_headers:
      Authorization:
        - 'Token test-token'
      Content-Type:
        - 'application/json'
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - 'application/json'
        body: |
          {"count": 3, "next": null, "previous": "http://{{ hostname }}:{{ env "PORT" }}/rest/rules/es/events_tail/?qfilter=event_type%3Aanomaly&from_date={{ .request.vars.fd }}&to_date={{ .request.vars.td }}&page_size=2&page_number=1", "results": [{"event_type": "anomaly", "timestamp": "2024-01-15T12:00:10.999999+0000", "src_ip": "198.51.100.13", "src_port": 51347, "dest_ip": "203.0.113.23", "dest_port": 22, "proto": "TCP", "flow_id": 2019054435055805, "anomaly": {"type": "stream", "event": "STREAM_3WHS_ACK_IN_WRONG_DIR", "layer": "stream", "code": 31}}]}
  # --- Regression guard: catch-all for any other events_tail anomaly request
  # (e.g. missing/unmatched query params, or a cursor regression re-sending the
  # initial-interval window instead of the persisted bookmark). Returns an
  # oversized batch so hit_count assertions fail loudly. ---
  - path: /rest/rules/es/events_tail/
    methods: ['GET']
    query_params:
      qfilter: 'event_type:anomaly'
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - 'application/json'
        body: |
          {"count": 50, "next": null, "previous": null, "results": [
            {"event_type": "anomaly", "timestamp": "2020-01-01T00:00:00Z", "anomaly": {"type": "regression", "event": "REGRESSION_GUARD_UNEXPECTED_REQUEST_SHAPE", "layer": "regression", "code": 9999}},
            {"event_type": "anomaly", "timestamp": "2020-01-01T00:00:01Z", "anomaly": {"type": "regression", "event": "REGRESSION_GUARD_UNEXPECTED_REQUEST_SHAPE", "layer": "regression", "code": 9999}}
          ]}
