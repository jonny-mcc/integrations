        body: |
          {"count": 50, "next": null, "previous": null, "results": [
            {"event_type": "smb_insights", "timestamp": "2020-01-01T00:00:00Z", "smb_insights": {"trackers": {"status": {"counters": {"REGRESSION_GUARD_UNEXPECTED_REQUEST_SHAPE": 1}}}}},
            {"event_type": "smb_insights", "timestamp": "2020-01-01T00:00:01Z", "smb_insights": {"trackers": {"status": {"counters": {"REGRESSION_GUARD_UNEXPECTED_REQUEST_SHAPE": 1}}}}}
